<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vaaniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="42" stroke="url(#vaaniGrad)" stroke-width="4" filter="url(#glow)" opacity="0.8"/>
  <circle cx="50" cy="50" r="30" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Central Soundwave & V-mark -->
  <path d="M30 45 L40 68 L50 32 L60 68 L70 45" stroke="url(#vaaniGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="50" r="6" fill="#22D3EE" filter="url(#glow)"/>
